language: typescript
tasks:
  build:
    command: "vite build"
    inputs:
      - "src/**/*"
    outputs:
      - "dist"
  dev:
    command: "vite"
  lint:
    command: "eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0"

dependsOn:
  - "@teskooano/data-types"
  - "@teskooano/core-state"
