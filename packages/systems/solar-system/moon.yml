id: "solar-system"

tasks:
  test:
    command: vitest
    args: run
    options:
      runInCI: true
  test-ui:
    command: vitest
    args: --ui
    options:
      runInCI: false
  test-coverage:
    command: vitest
    args: run --coverage
    options:
      runInCI: true
  test-watch:
    command: vitest
    args:
    options:
      runInCI: false
  test-browser:
    command: vitest
    args: run --browser
    options:
      runInCI: true
