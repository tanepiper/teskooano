type: "library"
language: "typescript"

id: threejs-camera

fileGroups:
  sources:
    - "src/**/*"
  tests:
    - "src/**/*.spec.ts"

tasks:
  build:
    command: "vite build"
    inputs:
      - "@globs(sources)"
    outputs:
      - "dist"
  lint:
    command: "npm run lint"
    inputs:
      - "@globs(sources)"
  test:
    command: "vitest"
