<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer wireframe sphere -->

  <!-- Central Sun -->
  <circle cx="50" cy="50" r="4" fill="#ff0" />

  <!-- Planet 1 -->
  <g>
    <circle cx="70" cy="50" r="1" fill="#f00" />
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="rotate"
                      from="0 50 50"
                      to="360 50 50"
                      dur="6s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Planet 2 -->
  <g>
    <circle cx="80" cy="50" r="2" fill="#0f0" />
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="rotate"
                      from="0 50 50"
                      to="360 50 50"
                      dur="10s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Planet 3 -->
  <g>
    <circle cx="90" cy="50" r="3" fill="#00f" />
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="rotate"
                      from="0 50 50"
                      to="360 50 50"
                      dur="14s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Optional text -->
  <text x="50" y="20" font-family="sans-serif" font-size="6" fill="#fff" text-anchor="middle">
    Loading...
  </text>
</svg>