<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" href="/pwa-192x192" sizes="192x192" />
    <link rel="icon" href="/assets/icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Teskooano</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #121212;
        overflow: hidden;
      }
      #app {
        height: 100%;
      }
      #loading {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1000;
        background-color: #121212;
      }
      #loading img {
        width: 300px;
        height: 300px;
      }
    </style>
    <meta
      name="description"
      content="Teskooano is a 3D N-Body Simulator build in Web Components."
    />
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="app">
      <div id="loading">
        <img src="/assets/loading-spinner.svg" alt="Loading..." />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
