<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" href="/pwa-192x192" sizes="192x192" />
    <link rel="icon" href="/assets/icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
    <title>Teskooano</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #121212;
        overflow: hidden;
        /* Prevent touch callouts and selections on mobile */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        /* Improve touch responsiveness */
        touch-action: manipulation;
      }
      #app {
        height: 100%;
        touch-action: manipulation;
      }
      #loading {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1000;
        background-color: #121212;
        touch-action: none;
      }
      #loading img {
        width: 300px;
        height: 300px;
        max-width: 80vw;
        max-height: 80vh;
      }
      /* Prevent zoom on input focus */
      input, select, textarea {
        font-size: 16px !important;
      }
      /* Improve button touch targets */
      button, [role="button"] {
        touch-action: manipulation;
        min-height: 44px;
        min-width: 44px;
      }
      @media (pointer: coarse) {
        button, [role="button"] {
          min-height: 48px;
          min-width: 48px;
        }
      }
    </style>
    <meta
      name="description"
      content="Teskooano is a 3D N-Body Simulator build in Web Components."
    />
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="app">
      <div id="loading">
        <img src="/assets/loading-spinner.svg" alt="Loading..." />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
